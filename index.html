<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صورة بروفايل طموح</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14027D;--orange:#F06C00;--bg:#EFECFB;--card:#fff;--ink:#241E45;--mute:#6B6785;--line:#E2DEF5;--soft:#EEEBFA;--hd:#14027D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0345;--card:#140872;--ink:#F3F1FF;--mute:#B7B1E6;--line:#2B1D9A;--soft:#20128D;--hd:#0A0345}}
:root[data-theme="dark"]{--bg:#0A0345;--card:#140872;--ink:#F3F1FF;--mute:#B7B1E6;--line:#2B1D9A;--soft:#20128D;--hd:#0A0345}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.7;min-height:100vh}
.hero{background:radial-gradient(120% 90% at 50% 0%,#2A10C9 0%,var(--hd) 62%);color:#fff;text-align:center;padding:26px 18px 120px;border-radius:0 0 44px 44px}
.tag{display:inline-block;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:1px 16px;border-radius:20px}
h1{font-size:28px;font-weight:800;margin-top:6px;line-height:1.4}
.hero p{opacity:.8;font-size:14.5px}
.wrap{max-width:460px;margin:-96px auto 0;padding:0 18px 40px}
.card{background:var(--card);border-radius:30px;padding:22px 20px 20px;box-shadow:0 24px 60px rgba(20,2,125,.28);border:1.5px solid var(--line)}
.stage{width:min(100%,360px);aspect-ratio:1;margin:0 auto;border-radius:50%;box-shadow:0 18px 40px rgba(20,2,125,.35)}
canvas{width:100%;height:100%;display:block;border-radius:50%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{text-align:center;color:var(--mute);font-size:13px;margin-top:14px;min-height:22px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:16px;padding:12px 18px;font:700 16px Cairo,Tahoma,sans-serif;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--orange);color:#fff;margin-top:12px}
.btn.sec{background:var(--navy);color:#fff;margin-top:14px}
:root[data-theme="dark"] .btn.sec{background:#3B26D8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.sec{background:#3B26D8}}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{margin-top:16px}
.row label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:var(--orange);margin-top:6px;height:28px}
.drop{border:2.5px dashed var(--orange);border-radius:18px;padding:8px;text-align:center;color:var(--mute);font-size:13px;margin-top:12px}
.drop.on{background:rgba(240,108,0,.12)}
.note{text-align:center;font-size:12.5px;color:var(--mute);margin-top:16px}
#fallback{display:none;margin-top:16px;text-align:center}
#fallback img{width:220px;max-width:70%;border-radius:50%}
#fallback p{font-size:13px;color:var(--mute);margin-top:6px}
.msg{text-align:center;font-weight:700;font-size:14px;margin-top:10px;min-height:22px;color:var(--orange)}
input[type=file]{display:none}
</style></head><body>
<div class="hero"><span class="tag">عائلة طموح</span><h1>صورة بروفايل موحّدة</h1><p>حوّل صورتك إلى الصورة الرسمية لأعضاء النادي</p></div>
<div class="wrap">
<div class="card">
  <div class="stage"><canvas id="cv" width="1080" height="1080"></canvas></div>
  <div class="hint" id="hint">اختر صورتك ثم اسحبها لضبط الوجه في الوسط</div>
  <button class="btn pri" id="pick">اختيار صورة</button>
  <input type="file" id="file" accept="image/*">
  <div class="drop" id="drop">أو اسحب الصورة وأفلتها هنا</div>
  <div class="row"><label><span>التكبير</span><span id="zv">100%</span></label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1" disabled></div>
  <button class="btn sec" id="dl" disabled>حفظ الصورة</button>
  <div class="msg" id="msg"></div>
  <div id="fallback"><img id="fimg" alt=""><p>اضغط مطولًا على الصورة لحفظها في هاتفك</p></div>
</div>
<p class="note">تتم معالجة الصورة داخل جهازك فقط، ولا يتم رفعها إلى أي مكان.</p>

  var ww=190,wk=ww/(WB[2]-WB[0]),wh=(WB[3]-WB[1])*wk;
  ctx.save();ctx.translate(CX-ww/2-WB[0]*wk,py+ph/2-wh/2-WB[1]*wk);ctx.scale(wk,wk);ctx.fillStyle=ORANGE;ctx.fill(WORD,"evenodd");ctx.restore();

function load(f){
  if(!f||!/^image\//.test(f.type)){msg.textContent="اختر ملف صورة من فضلك";return}
  msg.textContent="";var url=URL.createObjectURL(f),im=new Image();
  im.onload=function(){img=im;zm=1;ox=0;oy=0;zoom.value=1;zv.textContent="100%";zoom.disabled=false;dl.disabled=false;
    hint.textContent="اسحب الصورة لتحريكها، واستعمل الشريط للتكبير";document.getElementById("fallback").style.display="none";draw();URL.revokeObjectURL(url)};
  im.onerror=function(){msg.textContent="تعذّر فتح هذه الصورة"};im.src=url;
}
document.getElementById("pick").onclick=function(){fileIn.click()};
fileIn.onchange=function(){load(fileIn.files[0])};
var drop=document.getElementById("drop");
["dragover","dragenter"].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add("on")})});
["dragleave","drop"].forEach(function(e){document.addEventListener(e,function(){drop.classList.remove("on")})});
document.addEventListener("drop",function(ev){ev.preventDefault();if(ev.dataTransfer.files[0])load(ev.dataTransfer.files[0])});
zoom.oninput=function(){if(!img)return;zm=parseFloat(zoom.value);zv.textContent=Math.round(zm*100)+"%";clamp();draw()};
cv.addEventListener("wheel",function(e){if(!img)return;e.preventDefault();zm=Math.min(3,Math.max(1,zm-e.deltaY*0.002));zoom.value=zm;zv.textContent=Math.round(zm*100)+"%";clamp();draw()},{passive:false});
var drag=null;
cv.addEventListener("pointerdown",function(e){if(!img)return;drag={x:e.clientX,y:e.clientY,ox:ox,oy:oy};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",function(e){if(!drag)return;var k=S/cv.getBoundingClientRect().width;ox=drag.ox+(e.clientX-drag.x)*k;oy=drag.oy+(e.clientY-drag.y)*k;clamp();draw()});
["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){drag=null})});
dl.onclick=function(){
  if(!img)return;msg.textContent="";
  cv.toBlob(function(blob){
    if(!blob){msg.textContent="تعذّر إنشاء الصورة";return}
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="tomouh-profile.png";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
    msg.textContent="تم الحفظ، مرحبًا بك في عائلة طموح";
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent))showFallback();
  },"image/png");
};
function showFallback(){document.getElementById("fimg").src=cv.toDataURL("image/png");document.getElementById("fallback").style.display="block";msg.textContent=""}
draw();
})();
